# Deploy da demonstração na Netlify.
# A demo é um site 100% estático (dados no navegador), por isso usa a
# exportação estática do Next.js (pasta out/). Quando a versão com servidor
# (banco + integrações) existir, basta remover STATIC_EXPORT e o `publish`
# para a Netlify usar o runtime de Next.js.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  STATIC_EXPORT = "true"
  NODE_VERSION = "22"

# Cache longo para os arquivos com hash gerados pelo Next.js
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O painel e o acompanhamento de pedidos não devem ser indexados
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
